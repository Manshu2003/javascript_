<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Switcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="contianer">
      <h1 class="heading">Color Changer</h1>
      <div class="inputBtnContianer">
        <button class="randombtn" type="button">Random Color</button>
        <input
          type="text"
          placeholder="Enter a color or hex(e.g white or #fffff)"
          id="inputbtn"
        />
        <button class="applybtn" type="button">Apply Color</button>
      </div>
      <p class="currntcolor">
        Current Color: <span class="currntcolorvalue">green</span>
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
